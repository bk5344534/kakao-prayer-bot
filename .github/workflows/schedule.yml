name: Daily Prayer Alarm

on:
  schedule:
    # UTC 21:00 = 한국시간(KST) 다음날 오전 6:00
    - cron: '00 21 * * *'

  # GitHub에서 직접 실행할 수 있도록 설정
  workflow_dispatch:


jobs:
  run-script:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    # ==========================================
    # GitHub Secrets를 환경변수로 전달
    # ==========================================
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      # main2(상대방에게 발송) 실행할 경우 아래 내용 실행
      # KAKAO_RECEIVER_UUIDS: ${{ secrets.KAKAO_RECEIVER_UUIDS }}

    steps:

      # ==========================================
      # 1. GitHub 저장소 가져오기
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python 설치
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'


      # ==========================================
      # 3. 필요한 라이브러리 설치
      # ==========================================
      - name: Install dependencies
        run: pip install requests


      # ==========================================
      # 4. main.py 실행 - 상대방에게 발송할 경우 main2로 변경
      # ==========================================
      - name: Run main.py
        run: python main.py


      # ==========================================
      # 5. status.json 변경사항 저장
      # ==========================================
      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add status.json

          git commit -m "Auto-update prayer status [skip ci]" || exit 0

          git push
