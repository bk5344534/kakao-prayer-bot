name: Daily Prayer Alarm

on:
  schedule:
    # UTC 22:00 = 한국시간(KST) 다음날 아침 07:00
    - cron: '50 04 * * *'
  workflow_dispatch: # 버튼을 눌러 수동 실행도 가능하게 설정

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 토큰 및 status.json 자동 갱신 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run main.py
        run: python main.py

      - name: Commit & Push changes (Tokens & Status)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json kakao_code.json
          git commit -m "Auto-update token and status [skip ci]" || exit 0
          git push
